name = "jev-chorale-proxy"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://adammichaelwood.com,https://adammichaelwood.github.io,http://localhost:5173,http://localhost:4173"
PER_IP_DAILY = "12000"   # ~4.5 hours of piano (3 requests per chord) or ~80 chorale runs per address per day; ≈ $0.60 worst case
GLOBAL_DAILY = "60000"   # ~$3/day worst case at ~1,300 tokens per request

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
